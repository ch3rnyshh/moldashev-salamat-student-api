name: moldashev-salamat-student-api

services:
  app:
    build: .
    image: moldashev-salamat-student-api:v1.0-moldashev-salamat
    container_name: moldashev-salamat-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student-net

  db:
    image: postgres:16
    container_name: moldashev-salamat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-net

networks:
  student-net:
    name: moldashev-salamat-student-net

volumes:
  pgdata:
    name: moldashev-salamat-pgdata
